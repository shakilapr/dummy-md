[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dummy-md"
version = "0.1.0"
description = "Generate arbitrary amounts of syntactically valid, configurable Markdown placeholder content."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "dummy-md contributors" }
]
keywords = [
    "markdown",
    "generator",
    "lorem-ipsum",
    "standard-markdown",
    "gfm",
    "testing",
    "benchmarking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "markdown-it-py>=3.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
dummy-md = "dummy_md.cli:main"

[project.entry-points."dummy_md.elements"]
# Plugins can register element generators here

[tool.hatch.build.targets.wheel]
packages = ["src/dummy_md"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
